/* 主题首绘守卫：在样式表之前决定 data-theme，避免夜间刷新时先画一帧白天 */
(function(){
  try{
    var t = localStorage.getItem('dsh-forum-theme');
    if(t === 'auto'){ t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'; }
    if(t !== 'day' && t !== 'night'){ return; }
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = (t === 'night' ? 'dark' : 'light');
  }catch(e){}
})();
</script>
